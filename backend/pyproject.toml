[project]
name = "rag-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anish" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cloudinary>=1.46.3",
    "fastapi[standard]>=0.142.2",
    "jwt>=1.4.0",
    "numpy>=2.4.6",
    "openai",
    "passlib>=1.7.4",
    "pgvector>=0.5.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
]


[project.scripts]
rag-app = "app.main:main"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = "src"


[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
