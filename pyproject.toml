[project]
name = "rag-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anish" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.2",
    "openai",
    "pgvector>=0.5.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
]


[project.scripts]
rag-app = "app.main:main"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = "src"


[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
